# P00/P01 only: no Agent is built and no tool/model is invoked.
# user.home and workspace are supplied by prepare_skill_week1.py.
# Iteration settings are recorded defaults, NOT proof of P06 budget enforcement.
model:
  vendor: deepseek
  name: deepseek-flash
  api_key: ""
agent:
  max_rounds: 1
  max_agent_iterations: 4
skills:
  extra_dirs:
    - ${SKILL_EVAL_SOURCE_ROOT}/.claude/skills
workspace:
  dirs: []
ui:
  theme: minimal
  fullscreen: false
  mouse: false
  color: never
opik:
  enabled: false
