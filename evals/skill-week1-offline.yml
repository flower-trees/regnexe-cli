# P07/P08 isolated offline description evaluation. Runner supplies source root and API key.
model:
  vendor: deepseek
  name: deepseek-flash
  chat_url: https://api.deepseek.com/v1/chat/completions
  api_key: ${DEEPSEEK_KEY}
  planner_name: deepseek-flash
  reflector_name: deepseek-flash
agent:
  max_rounds: 1
  max_agent_iterations: 4
  execution_budget:
    hard_max_iterations: 4
    max_model_calls: 6
    retry_execution: false
  require_factual_review: true
  factual_review_source: ${SKILL_EVAL_FACTS_JSON}
  offline_text_review:
    task_summary: 根据给定产品事实离线改写机器人介绍。
    acceptance_criteria:
      - 仅返回 JSON 对象，恰含 description 和 detail_description 两个非空字符串字段，不含代码围栏。
      - description 为简短概述；detail_description 用自然段围绕产品用途和已知能力展开。
      - 保留提供的产品事实；允许忠实转述，不新增未经提供的产品属性、效果、使用范围或参数。
      - 不出现“官网”、来源说明、内部备注或参数表，不要求文件、数据库、网络或上传操作。
  allowed_base_tools: [read_file, list_files, search_files]
  session_compact_period: 100000
  context_window_size: 100000
skills:
  extra_dirs:
    - ${SKILL_EVAL_SOURCE_ROOT}/.claude/skills
workspace:
  dirs: []
ui:
  theme: minimal
  fullscreen: false
  color: never
  icons: false
opik:
  enabled: true
  endpoint: http://localhost:28173/api/v1/private/otel
  project: regnexe-skill-week1
  max_text_chars: 50000
