# Eval-only rex config, loaded via REX_CONFIG (not ~/.rex/config.yml — the user's interactive
# config is untouched). Same model/opik settings as ~/.rex/config.yml, but with bash/write/edit
# confirmation prompts OFF: the eval harness pipes a task non-interactively (no TTY, no human to
# answer "apply this write?"), and an unanswered confirmation always resolves to "cancelled" —
# every write_file call in the real run just came back "Write cancelled by user." every time. Only
# usable here because each eval case runs in its own throwaway scratch directory, never the user's
# real filesystem.

model:
  vendor: custom
  name: harness-punchbag-flash
  chat_url: http://localhost:4000/v1/chat/completions
  api_key: ${LITELLM_MASTER_KEY}
  planner_name: harness-punchbag-pro
  reflector_name: harness-punchbag-pro

agent:
  max_rounds: 8
  max_agent_iterations: 20
  session_buffer_size: 10
  context_window_size: 6

workspace:
  dirs: []

ui:
  theme: minimal
  color: never
  icons: false
  compact: true

tools:
  bash:
    require_confirmation: false
    extra_blocked: []
  fs:
    require_confirmation: false

opik:
  enabled: true
  endpoint: http://localhost:28173/api/v1/private/otel
  project: regnexe-cli
