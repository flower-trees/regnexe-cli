# Eval-only rex config, loaded via REX_CONFIG (not ~/.rex/config.yml — the user's interactive
# config is managed separately). Official DeepSeek Flash for all roles, with bash/write/edit
# confirmation prompts OFF: the eval harness pipes a task non-interactively (no TTY, no human to
# answer "apply this write?"), and an unanswered confirmation always resolves to "cancelled" —
# every write_file call in the real run just came back "Write cancelled by user." every time. Only
# intended for generated fixtures in disposable directories. This is not an OS sandbox and
# must not be used to evaluate approval/ALWAYS behavior; those use Java/interactive tests.

model:
  vendor: deepseek
  name: deepseek-flash
  chat_url: https://api.deepseek.com/v1/chat/completions
  api_key: ${DEEPSEEK_KEY}
  planner_name: deepseek-flash
  reflector_name: deepseek-flash

agent:
  max_rounds: 8
  max_agent_iterations: 20
  session_buffer_size: 10
  context_window_size: 6

workspace:
  dirs: []

ui:
  theme: minimal
  color: never
  icons: false
  compact: true

tools:
  bash:
    require_confirmation: false
    extra_blocked: []
  fs:
    require_confirmation: false

opik:
  enabled: true
  endpoint: http://localhost:28173/api/v1/private/otel
  project: regnexe-cli
