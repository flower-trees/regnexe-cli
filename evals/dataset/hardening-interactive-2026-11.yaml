- id: interactive-session-a-b-a
  mode: interactive
  category: session_approvals
  steps:
    - Start rex in a disposable project with session A and choose always for a tool.
    - Switch to session B with /resume and trigger the same tool confirmation.
    - Switch back to A and trigger the same tool.
  expected:
    - B asks again; A retains its earlier approval in this process.
    - Prompt says always (this session).

- id: interactive-agent-rebuild
  mode: interactive
  category: session_approvals
  steps:
    - Grant always in A, then rebuild the agent by toggling an existing test plugin or MCP server.
    - Trigger the same tool in A again; use only disposable test plugins/services.
  expected:
    - Approval remains in A after rebuild.

- id: interactive-restart
  mode: interactive
  category: session_approvals
  steps:
    - Grant always in A, exit rex, and restart with the same saved session.
    - Trigger the same confirmation.
  expected:
    - Current implementation asks again after restart.
    - Persistent session approvals are a separate TODO, not implemented or counted as passing here.

- id: interactive-ctrl-c
  mode: interactive
  category: shell_lifecycle
  steps:
    - Ask bash to run printf started; sleep 45, then press Ctrl+C once after started appears.
    - Inspect paused status and the command process, then resume with a supplement.
  expected:
    - Shell stops, partial output is retained, tracked child processes are cleaned and agent pauses.
    - Resuming does not silently repeat external side effects.
