# Budget fragment for the forthcoming single-case Skill runner, NOT a complete REX_CONFIG.
# No model requests are made by reading this file.
agent:
  max_rounds: 1
  max_agent_iterations: 4
  execution_budget:
    hard_max_iterations: 4
    max_model_calls: 6
    retry_execution: false
runner:
  timeout_seconds: 120
  automatic_retries: 0
  token_observation_threshold: 30000
  # Observation threshold is NOT a hard provider token limit.
  token_limit_enforced: false
