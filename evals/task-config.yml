# Offline task: no database, upload, Shell or file mutation tools.
model:
  vendor: deepseek
  name: deepseek-flash
  chat_url: https://api.deepseek.com/v1/chat/completions
  api_key: ${DEEPSEEK_KEY}
  planner_name: deepseek-flash
  reflector_name: deepseek-flash
agent:
  max_rounds: 1
  max_agent_iterations: 4
  execution_budget:
    hard_max_iterations: 4
    max_model_calls: 6
    retry_execution: false
  allowed_base_tools:
  - read_file
  - list_files
  - search_files
  session_compact_period: 100000
  context_window_size: 100000
skills:
  extra_dirs:
  - ${SKILL_EVAL_SOURCE_ROOT}/.claude/skills
workspace:
  dirs: []
ui:
  theme: minimal
  fullscreen: false
  color: never
  icons: false
opik:
  enabled: true
  endpoint: http://localhost:28173/api/v1/private/otel
  project: regnexe-skill-week1
  max_text_chars: 50000
