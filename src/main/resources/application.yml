spring:
  application:
    name: regnexe-cli
  main:
    web-application-type: none
    banner-mode: off

models:
  http:
    # Plan/Reflect/Execute LLM calls are synchronous (non-streaming): the client blocks
    # until the full completion is returned. Larger prompts (session history, capability
    # descriptions) can take longer than the 60s default, especially against a busy vendor
    # API, which surfaces as SocketTimeoutException. 150s gives real headroom without
    # exceeding the 300s callTimeout cap.
    read-timeout-ms: 150000

logging:
  level:
    root: WARN
    # Suppress framework-internal WARNs that are expected and benign:
    # - CapabilityExecutor: warns when planner hallucinates a capability ID that
    #   doesn't exist (common with empty tool registry; execution falls back to LLM)
    # - TaskPlanner: warns on occasional LLM JSON parse hiccups (auto-repaired)
    org.salt.regnexe.agent.core.task.worker: ERROR
    org.salt.jlangchain: ERROR
