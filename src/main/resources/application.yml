spring:
  application:
    name: regnexe-cli
  main:
    web-application-type: none
    banner-mode: off

models:
  http:
    # Plan/Reflect/Execute LLM calls are synchronous (non-streaming): the client blocks
    # until the full completion is returned. Larger prompts (session history, capability
    # descriptions) can take longer than the 60s default, especially against a busy vendor
    # API, which surfaces as SocketTimeoutException. 150s gives real headroom without
    # exceeding the 300s callTimeout cap.
    read-timeout-ms: 150000

logging:
  level:
    root: WARN
    # - TaskPlanner: warns on occasional LLM JSON parse hiccups (auto-repaired) — still suppressed.
    # - CapabilityExecutor's "Capability not found: <id>" WARN used to be suppressed here too, on
    #   the assumption it was benign ("planner hallucinates an id, falls back to LLM"). It isn't
    #   always: a real, previously-silent id-mismatch bug (see FlatSkillLoader.loadOne) made this
    #   fire on every natural-language selection of a flat skill, silently stripping that round of
    #   both its skill instructions and its tools. Left visible at WARN so a recurrence surfaces
    #   immediately instead of masquerading as "the model just isn't calling tools".
    org.salt.regnexe.agent.core: ERROR
    org.salt.regnexe.agent.core.task.worker: WARN
    org.salt.regnexe.agent.core.RegnexeAgent: ERROR
    org.salt.jlangchain: ERROR
    org.salt.function.flow.context.ContextBus: ERROR
    org.jline: ERROR
